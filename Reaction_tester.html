<!DOCTYPE html>
<html>
<head>
<style>
  body { margin:0; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:sans-serif; color:#fff; background:#e74c3c; user-select:none; cursor:pointer; }
  h1 { font-size:48px; margin:10px; }
</style>
</head>
<body id="b">
<h1 id="t">Wait for Green...</h1>
<p id="s">Click anywhere to start / react</p>
<script>
  const b = document.getElementById('b'), t = document.getElementById('t'), s = document.getElementById('s');
  let state = 'waiting', st, timer;
  b.onclick = () => {
    if(state === 'waiting') {
      state = 'ready';
      b.style.background = '#e74c3c';
      t.innerText = 'Wait for Green...';
      s.innerText = '';
      timer = setTimeout(() => {
        state = 'go';
        b.style.background = '#2ecc71';
        t.innerText = 'CLICK NOW!';
        st = Date.now();
      }, 2000 + Math.random() * 3000);
    } else if(state === 'ready') {
      clearTimeout(timer);
      t.innerText = 'Too Early!';
      s.innerText = 'Click to try again.';
      state = 'waiting';
    } else if(state === 'go') {
      const diff = Date.now() - st;
      t.innerText = diff + ' ms';
      s.innerText = 'Click to play again.';
      state = 'waiting';
    }
  };
</script>
</body>
</html>
