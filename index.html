<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shrink – Game Launcher</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #141b31;
      --text: #e8edf8;
      --muted: #a4b0cf;
      --accent: #7aa2ff;
      --accent-2: #5de4c7;
      --border: #253154;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(180deg, #0b1020 0%, #0d1330 100%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      padding: 1.2rem;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 15, 32, 0.9);
      position: sticky;
      top: 0;
      backdrop-filter: blur(8px);
      z-index: 1;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.2rem, 2.5vw, 1.8rem);
    }

    p {
      margin: 0.4rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    main {
      display: grid;
      grid-template-columns: minmax(250px, 340px) 1fr;
      gap: 1rem;
      padding: 1rem;
      min-height: 0;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      min-height: 0;
    }

    #game-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.6rem;
      max-height: calc(100vh - 220px);
      overflow: auto;
    }

    .game-item {
      border: 1px solid var(--border);
      background: #0f1731;
      border-radius: 10px;
      padding: 0.75rem;
      display: grid;
      gap: 0.5rem;
    }

    .game-title {
      font-weight: 650;
    }

    .game-file {
      color: var(--muted);
      font-size: 0.86rem;
      word-break: break-all;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    button,
    a.button-link {
      appearance: none;
      border: 1px solid var(--border);
      color: var(--text);
      background: #1a2345;
      border-radius: 8px;
      padding: 0.45rem 0.7rem;
      font: inherit;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:hover,
    a.button-link:hover,
    button:focus-visible,
    a.button-link:focus-visible {
      border-color: var(--accent);
      outline: none;
    }

    .primary {
      background: linear-gradient(120deg, var(--accent), #9a85ff);
      color: #06080f;
      border: none;
      font-weight: 650;
    }

    #viewer {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 0.8rem;
    }

    #viewer-bar {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
    }

    #frame-wrap {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      min-height: 420px;
      background: #090e1f;
    }

    iframe {
      width: 100%;
      height: max(60vh, 420px);
      border: 0;
      background: #000;
    }

    .empty {
      padding: 1rem;
      color: var(--muted);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Shrink Launcher</h1>
    <p>Pick a game and play it here, or open it in a new tab.</p>
  </header>

  <main>
    <section class="panel" aria-labelledby="games-heading">
      <h2 id="games-heading">Games</h2>
      <ul id="game-list" aria-live="polite">
        <li class="empty">Loading games…</li>
      </ul>
    </section>

    <section class="panel" id="viewer" aria-labelledby="viewer-heading">
      <h2 id="viewer-heading">Now Playing</h2>
      <div id="viewer-bar">
        <span id="current-game">No game selected</span>
        <a id="open-current" class="button-link" target="_blank" rel="noopener noreferrer" hidden>
          Open in new tab
        </a>
      </div>
      <div id="frame-wrap">
        <p class="empty">Select a game to launch it in this page.</p>
      </div>
    </section>
  </main>

  <script>
    const FALLBACK_GAME_FILES = [
      'Obby.html',
      'Reaction_tester.html',
      'Retro_Synthesizer.html',
      'Voice_Changer.html',
      'Canvas.html'
    ];

    const gameList = document.getElementById('game-list');
    const currentGame = document.getElementById('current-game');
    const openCurrent = document.getElementById('open-current');
    const frameWrap = document.getElementById('frame-wrap');

    function isGameFile(path) {
      const lower = path.toLowerCase();
      return lower.endsWith('.html') && lower !== 'index.html';
    }

    function cleanPath(href) {
      if (!href) return '';
      const withoutQuery = href.split('#')[0].split('?')[0];
      return decodeURIComponent(withoutQuery.replace(/^\.\//, '').replace(/^\//, ''));
    }

    function gameTitleFromFile(file) {
      return file
        .replace(/\.html$/i, '')
        .replace(/[_-]+/g, ' ')
        .replace(/\b\w/g, ch => ch.toUpperCase());
    }

    async function discoverFromDirectoryListing() {
      try {
        const response = await fetch('./', { cache: 'no-store' });
        if (!response.ok) return [];
        const html = await response.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const files = [...doc.querySelectorAll('a[href]')]
          .map(link => cleanPath(link.getAttribute('href')))
          .filter(isGameFile);
        return [...new Set(files)];
      } catch {
        return [];
      }
    }

    function toAbsoluteUrl(file) {
      return new URL(file, document.baseURI).href;
    }

    function setCurrentGame(file) {
      const title = gameTitleFromFile(file);
      currentGame.textContent = title;

      openCurrent.href = toAbsoluteUrl(file);
      openCurrent.hidden = false;

      frameWrap.innerHTML = '';
      const iframe = document.createElement('iframe');
      iframe.src = file;
      iframe.title = title;
      iframe.loading = 'eager';
      frameWrap.appendChild(iframe);
    }

    function renderGames(files) {
      gameList.innerHTML = '';

      if (!files.length) {
        const item = document.createElement('li');
        item.className = 'empty';
        item.textContent = 'No game files were found.';
        gameList.appendChild(item);
        return;
      }

      files.sort((a, b) => a.localeCompare(b));

      for (const file of files) {
        const item = document.createElement('li');
        item.className = 'game-item';

        const title = document.createElement('div');
        title.className = 'game-title';
        title.textContent = gameTitleFromFile(file);

        const fileLabel = document.createElement('div');
        fileLabel.className = 'game-file';
        fileLabel.textContent = file;

        const actions = document.createElement('div');
        actions.className = 'actions';

        const playHereButton = document.createElement('button');
        playHereButton.className = 'primary';
        playHereButton.type = 'button';
        playHereButton.textContent = 'Play here';
        playHereButton.addEventListener('click', () => setCurrentGame(file));

        const newTabLink = document.createElement('a');
        newTabLink.className = 'button-link';
        newTabLink.textContent = 'Open in new tab';
        newTabLink.href = toAbsoluteUrl(file);
        newTabLink.target = '_blank';
        newTabLink.rel = 'noopener noreferrer';

        actions.append(playHereButton, newTabLink);
        item.append(title, fileLabel, actions);
        gameList.appendChild(item);
      }

      setCurrentGame(files[0]);
    }

    async function initLauncher() {
      const discoveredFiles = await discoverFromDirectoryListing();
      const allFiles = [...new Set([...discoveredFiles, ...FALLBACK_GAME_FILES])]
        .map(cleanPath)
        .filter(isGameFile);
      renderGames(allFiles);
    }

    initLauncher();
  </script>
</body>
</html>
